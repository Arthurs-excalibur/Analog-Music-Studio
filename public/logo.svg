<svg viewBox="0 0 618 646" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="woodGradient" cx="40%" cy="30%">
      <stop offset="0%" style="stop-color:#8b6f47;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6b5436;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a3a28;stop-opacity:1" />
    </radialGradient>
    <pattern id="woodTexture" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="#6b5436"/>
      <line x1="0" y1="20" x2="200" y2="20" stroke="#5a4a30" stroke-width="1" opacity="0.3"/>
      <line x1="0" y1="45" x2="200" y2="45" stroke="#7a6a46" stroke-width="0.5" opacity="0.2"/>
      <line x1="0" y1="80" x2="200" y2="80" stroke="#5a4a30" stroke-width="1" opacity="0.3"/>
      <line x1="0" y1="120" x2="200" y2="120" stroke="#7a6a46" stroke-width="0.5" opacity="0.2"/>
      <line x1="0" y1="160" x2="200" y2="160" stroke="#5a4a30" stroke-width="1" opacity="0.3"/>
    </pattern>
    <linearGradient id="knobGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#555;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#222;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="keyWhiteGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d0d0d0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="keyBlackGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded rectangle background with wood texture -->
  <rect x="20" y="20" width="578" height="606" rx="40" ry="40" fill="url(#woodGradient)"/>
  <rect x="20" y="20" width="578" height="606" rx="40" ry="40" fill="url(#woodTexture)" opacity="0.4"/>

  <!-- Top section: Branding -->
  <text x="40" y="70" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#4a3a28" letter-spacing="1">VINTAGE</text>
  <text x="40" y="100" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#4a3a28" letter-spacing="1">SYNTH</text>

  <!-- Green LED indicator (top right) -->
  <circle cx="560" cy="60" r="12" fill="#2a2a2a"/>
  <circle cx="560" cy="60" r="10" fill="#1a1a1a"/>
  <circle cx="560" cy="60" r="8" fill="#00dd00" opacity="0.9"/>
  <circle cx="560" cy="60" r="8" fill="#00ff00" opacity="0.3" filter="url(#glow)"/>

  <!-- Knobs section (4 knobs) -->
  <g id="knob1">
    <circle cx="100" cy="180" r="32" fill="url(#knobGradient)"/>
    <circle cx="100" cy="180" r="30" fill="#333" opacity="0.6"/>
    <line x1="100" y1="155" x2="100" y2="145" stroke="#666" stroke-width="3" stroke-linecap="round"/>
    <text x="100" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#c8b9a5" font-weight="bold">ATTACK</text>
  </g>

  <g id="knob2">
    <circle cx="220" cy="180" r="32" fill="url(#knobGradient)"/>
    <circle cx="220" cy="180" r="30" fill="#333" opacity="0.6"/>
    <line x1="220" y1="155" x2="220" y2="145" stroke="#666" stroke-width="3" stroke-linecap="round"/>
    <text x="220" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#c8b9a5" font-weight="bold">DECAY</text>
  </g>

  <g id="knob3">
    <circle cx="340" cy="180" r="32" fill="url(#knobGradient)"/>
    <circle cx="340" cy="180" r="30" fill="#333" opacity="0.6"/>
    <line x1="340" y1="155" x2="340" y2="145" stroke="#666" stroke-width="3" stroke-linecap="round"/>
    <text x="340" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#c8b9a5" font-weight="bold">SUSTAIN</text>
  </g>

  <g id="knob4">
    <circle cx="460" cy="180" r="32" fill="url(#knobGradient)"/>
    <circle cx="460" cy="180" r="30" fill="#333" opacity="0.6"/>
    <line x1="460" y1="155" x2="460" y2="145" stroke="#666" stroke-width="3" stroke-linecap="round"/>
    <text x="460" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#c8b9a5" font-weight="bold">RELEASE</text>
  </g>

  <!-- LCD Display -->
  <rect x="100" y="280" width="418" height="80" rx="8" fill="#2a2a2a" stroke="#444" stroke-width="2"/>
  <rect x="105" y="285" width="408" height="70" rx="6" fill="#1a1a1a"/>
  
  <!-- LCD Grid Pattern -->
  <g opacity="0.1">
    <circle cx="140" cy="310" r="2" fill="#00ff00"/>
    <circle cx="155" cy="310" r="2" fill="#00ff00"/>
    <circle cx="170" cy="310" r="2" fill="#00ff00"/>
    <circle cx="185" cy="310" r="2" fill="#00ff00"/>
    <circle cx="200" cy="310" r="2" fill="#00ff00"/>
    <circle cx="140" cy="330" r="2" fill="#00ff00"/>
    <circle cx="155" cy="330" r="2" fill="#00ff00"/>
    <circle cx="170" cy="330" r="2" fill="#00ff00"/>
    <circle cx="185" cy="330" r="2" fill="#00ff00"/>
    <circle cx="200" cy="330" r="2" fill="#00ff00"/>
  </g>

  <!-- LCD Text -->
  <text x="220" y="315" font-family="monospace" font-size="16" fill="#00dd00" font-weight="bold">C3</text>
  <text x="220" y="340" font-family="monospace" font-size="11" fill="#00dd00" opacity="0.7">OCTAVE</text>

  <!-- Vent holes (decorative grid) -->
  <g id="vents" opacity="0.4">
    <circle cx="80" cy="380" r="2" fill="#333"/>
    <circle cx="95" cy="380" r="2" fill="#333"/>
    <circle cx="110" cy="380" r="2" fill="#333"/>
    <circle cx="125" cy="380" r="2" fill="#333"/>
    <circle cx="140" cy="380" r="2" fill="#333"/>
    <circle cx="80" cy="395" r="2" fill="#333"/>
    <circle cx="95" cy="395" r="2" fill="#333"/>
    <circle cx="110" cy="395" r="2" fill="#333"/>
    <circle cx="125" cy="395" r="2" fill="#333"/>
    <circle cx="140" cy="395" r="2" fill="#333"/>
    <circle cx="478" cy="380" r="2" fill="#333"/>
    <circle cx="493" cy="380" r="2" fill="#333"/>
    <circle cx="508" cy="380" r="2" fill="#333"/>
    <circle cx="523" cy="380" r="2" fill="#333"/>
    <circle cx="538" cy="380" r="2" fill="#333"/>
    <circle cx="478" cy="395" r="2" fill="#333"/>
    <circle cx="493" cy="395" r="2" fill="#333"/>
    <circle cx="508" cy="395" r="2" fill="#333"/>
    <circle cx="523" cy="395" r="2" fill="#333"/>
    <circle cx="538" cy="395" r="2" fill="#333"/>
  </g>

  <!-- Piano Keys -->
  <g id="pianoKeys">
    <!-- White Key 1 (A) -->
    <rect x="75" y="450" width="35" height="120" rx="4" fill="url(#keyWhiteGradient)" stroke="#888" stroke-width="1"/>
    <text x="92" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">A</text>

    <!-- Black Key 1 (A#/Bb) -->
    <rect x="105" y="450" width="22" height="80" rx="3" fill="url(#keyBlackGradient)" stroke="#222" stroke-width="1"/>
    <text x="116" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#999" opacity="0.5">S</text>

    <!-- White Key 2 (B) -->
    <rect x="127" y="450" width="35" height="120" rx="4" fill="url(#keyWhiteGradient)" stroke="#888" stroke-width="1"/>
    <text x="144" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">D</text>

    <!-- White Key 3 (C) -->
    <rect x="162" y="450" width="35" height="120" rx="4" fill="url(#keyWhiteGradient)" stroke="#888" stroke-width="1"/>
    <text x="179" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">F</text>

    <!-- Black Key 2 (C#/Db) -->
    <rect x="192" y="450" width="22" height="80" rx="3" fill="url(#keyBlackGradient)" stroke="#222" stroke-width="1"/>
    <text x="203" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#999" opacity="0.5">G</text>

    <!-- White Key 4 (D) -->
    <rect x="214" y="450" width="35" height="120" rx="4" fill="url(#keyWhiteGradient)" stroke="#888" stroke-width="1"/>
    <text x="231" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">H</text>

    <!-- Black Key 3 (D#/Eb) -->
    <rect x="244" y="450" width="22" height="80" rx="3" fill="url(#keyBlackGradient)" stroke="#222" stroke-width="1"/>
    <text x="255" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#999" opacity="0.5">T</text>

    <!-- White Key 5 (E) -->
    <rect x="266" y="450" width="35" height="120" rx="4" fill="url(#keyWhiteGradient)" stroke="#888" stroke-width="1"/>
    <text x="283" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Y</text>

    <!-- White Key 6 (F) -->
    <rect x="301" y="450" width="35" height="120" rx="4" fill="url(#keyWhiteGradient)" stroke="#888" stroke-width="1"/>
    <text x="318" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">U</text>

    <!-- Black Key 4 (F#/Gb) -->
    <rect x="331" y="450" width="22" height="80" rx="3" fill="url(#keyBlackGradient)" stroke="#222" stroke-width="1"/>
    <text x="342" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#999" opacity="0.5">W</text>

    <!-- White Key 7 (G) -->
    <rect x="353" y="450" width="35" height="120" rx="4" fill="url(#keyWhiteGradient)" stroke="#888" stroke-width="1"/>
    <text x="370" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">J</text>

    <!-- White Key 8 (A - right) -->
    <rect x="388" y="450" width="35" height="120" rx="4" fill="url(#keyWhiteGradient)" stroke="#888" stroke-width="1"/>
    <text x="405" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">K</text>
  </g>

  <!-- Shadow/3D effect on bottom -->
  <ellipse cx="309" cy="630" rx="280" ry="20" fill="#000" opacity="0.2"/>

  <!-- Filter for LED glow -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
